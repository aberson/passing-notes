[project]
name = "passing-notes"
version = "0.1.0"
description = "Local coordination notes and acknowledgements between agent lanes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
passing-notes = "passing_notes.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/passing_notes"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep ruff's default rules and also enforce line-length (E501 is not a default).
extend-select = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
