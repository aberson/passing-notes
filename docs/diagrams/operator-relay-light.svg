<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 231" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" role="img" aria-label="A lane that needs an operator decision asks in its own window and posts the question to the operator relay lane, Main, with a doorbell. Main shows the question verbatim, waits for the operator's answer, and replies with the operator's exact words on an operator-said line. The lane records the words and acts on them.">
  <defs>
    <marker id="ar-light" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#C0C9DA"/></marker>
    <marker id="ar-s-light" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3355E0"/></marker>
    <filter id="sh-light" x="-20%" y="-45%" width="140%" height="190%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(20,26,40,.16)"/></filter>
  </defs>
  <style>
    .bg{fill:#FFFFFF;stroke:#D4DBE8;stroke-width:1.5}
    .lnk{fill:none;stroke:#C0C9DA;stroke-width:1.7}
    .spine{fill:none;stroke:#3355E0;stroke-width:2.4}
    .node rect{fill:#FFFFFF;stroke:#C0C9DA;stroke-width:1.4;filter:url(#sh-light)}
    .pn{fill:#3355E0;font-size:13px;font-weight:600}
    .ps{fill:#6E778C;font-size:10.5px}
    .lbl{fill:#6E778C;font-size:11px;letter-spacing:.12em;font-weight:600}
    .cap{fill:#6E778C;font-size:10.5px}
  </style>
<rect class="bg" x="6" y="6" width="988" height="219" rx="16"/>
<text class="lbl" x="24" y="32">LANE</text>
<g class="node"><rect x="24" y="46" width="205" height="60" rx="10"/><text class="pn" x="38" y="66">needs a decision</text><text class="ps" x="38" y="83">asks in its own window</text><text class="ps" x="38" y="98">and posts it</text></g>
<text class="lbl" x="273" y="32">TO MAIN</text>
<g class="node"><rect x="273" y="46" width="205" height="60" rx="10"/><text class="pn" x="287" y="66">note to the relay</text><text class="ps" x="287" y="83">--needs operator-decision</text><text class="ps" x="287" y="98">+ doorbell</text></g>
<text class="lbl" x="522" y="32">MAIN (RELAY)</text>
<g class="node"><rect x="522" y="46" width="205" height="45" rx="10"/><text class="pn" x="536" y="66">shows the operator</text><text class="ps" x="536" y="83">the question, verbatim</text></g>
<path class="lnk" marker-end="url(#ar-light)" d="M624,91 V105"/>
<g class="node"><rect x="522" y="105" width="205" height="45" rx="10"/><text class="pn" x="536" y="125">operator answers</text><text class="ps" x="536" y="142">in Main; never inferred</text></g>
<text class="lbl" x="771" y="32">BACK TO THE LANE</text>
<g class="node"><rect x="771" y="46" width="205" height="60" rx="10"/><text class="pn" x="785" y="66">reply</text><text class="ps" x="785" y="83">operator-said: &lt;words&gt;</text><text class="ps" x="785" y="98">+ doorbell</text></g>
<path class="lnk" marker-end="url(#ar-light)" d="M874,106 V120"/>
<g class="node"><rect x="771" y="120" width="205" height="45" rx="10"/><text class="pn" x="785" y="140">lane acts</text><text class="ps" x="785" y="157">records the words verbatim</text></g>
<path class="spine" marker-end="url(#ar-s-light)" d="M229,76 C251,76 251,76 270,76"/>
<path class="spine" marker-end="url(#ar-s-light)" d="M478,76 C500,76 500,68 519,68"/>
<path class="spine" marker-end="url(#ar-s-light)" d="M727,68 C749,68 749,76 768,76"/>
<text class="cap" x="24" y="191">Accepted only from the relay lane, as a reply to the lane's own question.</text>
<text class="cap" x="24" y="207">Close confirmations work the same way: a close request with operator-said:.</text>
</svg>
