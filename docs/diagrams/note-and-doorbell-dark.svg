<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 231" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" role="img" aria-label="A sender lane posts a note to the private store and may ring the recipient. The doorbell goes through a headless Claude bridge that can only list sessions and send one message, in the recipient's own permission mode. The idle recipient window wakes, reads the note, acknowledges it and replies under its own rules.">
  <defs>
    <marker id="ar-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#384153"/></marker>
    <marker id="ar-s-dark" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6E9BFF"/></marker>
    <filter id="sh-dark" x="-20%" y="-45%" width="140%" height="190%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,.35)"/></filter>
  </defs>
  <style>
    .bg{fill:#161C26;stroke:#29313F;stroke-width:1.5}
    .lnk{fill:none;stroke:#384153;stroke-width:1.7}
    .spine{fill:none;stroke:#6E9BFF;stroke-width:2.4}
    .node rect{fill:#161C26;stroke:#384153;stroke-width:1.4;filter:url(#sh-dark)}
    .pn{fill:#6E9BFF;font-size:13px;font-weight:600}
    .ps{fill:#9AA5B8;font-size:10.5px}
    .lbl{fill:#9AA5B8;font-size:11px;letter-spacing:.12em;font-weight:600}
    .cap{fill:#9AA5B8;font-size:10.5px}
  </style>
<rect class="bg" x="6" y="6" width="988" height="219" rx="16"/>
<text class="lbl" x="24" y="32">SENDER LANE</text>
<g class="node"><rect x="24" y="46" width="205" height="45" rx="10"/><text class="pn" x="38" y="66">post</text><text class="ps" x="38" y="83">one immutable note</text></g>
<path class="lnk" marker-end="url(#ar-dark)" d="M126,91 V105"/>
<g class="node"><rect x="24" y="105" width="205" height="60" rx="10"/><text class="pn" x="38" y="125">wake send</text><text class="ps" x="38" y="142">bound, idle lanes only</text><text class="ps" x="38" y="157">Codex: with escalation</text></g>
<text class="lbl" x="273" y="32">PRIVATE STORE</text>
<g class="node"><rect x="273" y="46" width="205" height="45" rx="10"/><text class="pn" x="287" y="66">messages/&lt;project&gt;</text><text class="ps" x="287" y="83">notes, acks, cards</text></g>
<path class="lnk" marker-end="url(#ar-dark)" d="M376,91 V105"/>
<g class="node"><rect x="273" y="105" width="205" height="60" rx="10"/><text class="pn" x="287" y="125">wake/&lt;project&gt;</text><text class="ps" x="287" y="142">binding: session + mode</text><text class="ps" x="287" y="157">ring record: once</text></g>
<text class="lbl" x="522" y="32">DOORBELL BRIDGE</text>
<g class="node"><rect x="522" y="46" width="205" height="60" rx="10"/><text class="pn" x="536" y="66">claude -p</text><text class="ps" x="536" y="83">ListAgents, SendMessage</text><text class="ps" x="536" y="98">nothing else</text></g>
<path class="lnk" marker-end="url(#ar-dark)" d="M624,106 V120"/>
<g class="node"><rect x="522" y="120" width="205" height="45" rx="10"/><text class="pn" x="536" y="140">New Passing Note &lt;id&gt;</text><text class="ps" x="536" y="157">the id only, never content</text></g>
<text class="lbl" x="771" y="32">RECIPIENT LANE</text>
<g class="node"><rect x="771" y="46" width="205" height="45" rx="10"/><text class="pn" x="785" y="66">idle Claude window</text><text class="ps" x="785" y="83">wakes on the message</text></g>
<path class="lnk" marker-end="url(#ar-dark)" d="M874,91 V105"/>
<g class="node"><rect x="771" y="105" width="205" height="45" rx="10"/><text class="pn" x="785" y="125">read · ack · reply</text><text class="ps" x="785" y="142">under its own rules</text></g>
<path class="spine" marker-end="url(#ar-s-dark)" d="M229,68 C251,68 251,68 270,68"/>
<path class="spine" marker-end="url(#ar-s-dark)" d="M478,68 C500,68 500,76 519,76"/>
<path class="spine" marker-end="url(#ar-s-dark)" d="M727,76 C749,76 749,68 768,68"/>
<text class="cap" x="24" y="191">The sender reports note: · wake: · ack: · reply: separately, each from evidence.</text>
<text class="cap" x="24" y="207">Busy, closed, stale or unbound lanes are refused with exit 5; the note stays posted.</text>
</svg>
