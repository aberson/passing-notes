<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 261" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace" role="img" aria-label="The operator types in dev main, the workspace main. Dev main sees every project read-only, without note bodies, and exchanges notes with each project's main. Each project's main exchanges notes only with dev main and its own project's lanes. A project with no main of its own has dev main's window stand in as its main. A work lane never posts outside its project: such a post is refused with cross-project-not-allowed.">
  <defs>
    <marker id="ar-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#384153"/></marker>
    <marker id="ar-s-dark" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6E9BFF"/></marker>
    <filter id="sh-dark" x="-20%" y="-45%" width="140%" height="190%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,.35)"/></filter>
  </defs>
  <style>
    .bg{fill:#161C26;stroke:#29313F;stroke-width:1.5}
    .lnk{fill:none;stroke:#384153;stroke-width:1.7}
    .spine{fill:none;stroke:#6E9BFF;stroke-width:2.4}
    .node rect{fill:#161C26;stroke:#384153;stroke-width:1.4;filter:url(#sh-dark)}
    .pn{fill:#6E9BFF;font-size:13px;font-weight:600}
    .ps{fill:#9AA5B8;font-size:10.5px}
    .lbl{fill:#9AA5B8;font-size:11px;letter-spacing:.12em;font-weight:600}
    .cap{fill:#9AA5B8;font-size:10.5px}
  </style>
<rect class="bg" x="6" y="6" width="988" height="249" rx="16"/>
<text class="lbl" x="24" y="32">OPERATOR</text>
<g class="node"><rect x="24" y="46" width="205" height="60" rx="10"/><text class="pn" x="38" y="66">you</text><text class="ps" x="38" y="83">type in dev main</text><text class="ps" x="38" y="98">or in a project's main</text></g>
<text class="lbl" x="273" y="32">DEV MAIN</text>
<g class="node"><rect x="273" y="46" width="205" height="75" rx="10"/><text class="pn" x="287" y="66">dev / main</text><text class="ps" x="287" y="83">your window</text><text class="ps" x="287" y="98">sees every project</text><text class="ps" x="287" y="113">read-only, no bodies</text></g>
<path class="lnk" marker-end="url(#ar-dark)" d="M376,121 V135"/>
<g class="node"><rect x="273" y="135" width="205" height="45" rx="10"/><text class="pn" x="287" y="155">dev lanes</text><text class="ps" x="287" y="172">notes inside dev</text></g>
<text class="lbl" x="522" y="32">PROJECT MAINS</text>
<g class="node"><rect x="522" y="46" width="205" height="60" rx="10"/><text class="pn" x="536" y="66">&lt;P&gt; / main</text><text class="ps" x="536" y="83">notes with dev main</text><text class="ps" x="536" y="98">and its own lanes</text></g>
<path class="lnk" marker-end="url(#ar-dark)" d="M624,106 V120"/>
<g class="node"><rect x="522" y="120" width="205" height="75" rx="10"/><text class="pn" x="536" y="140">stand-in</text><text class="ps" x="536" y="157">no main of its own:</text><text class="ps" x="536" y="172">dev main's window</text><text class="ps" x="536" y="187">as &lt;P&gt; / main</text></g>
<text class="lbl" x="771" y="32">PROJECT LANES</text>
<g class="node"><rect x="771" y="46" width="205" height="45" rx="10"/><text class="pn" x="785" y="66">&lt;P&gt; lanes</text><text class="ps" x="785" y="83">notes inside &lt;P&gt; only</text></g>
<path class="lnk" marker-end="url(#ar-dark)" d="M874,91 V105"/>
<g class="node"><rect x="771" y="105" width="205" height="60" rx="10"/><text class="pn" x="785" y="125">refused</text><text class="ps" x="785" y="142">a lane to another project</text><text class="ps" x="785" y="157">cross-project-not-allowed</text></g>
<path class="spine" marker-end="url(#ar-s-dark)" d="M229,76 C251,76 251,84 270,84"/>
<path class="spine" marker-end="url(#ar-s-dark)" d="M478,84 C500,84 500,76 519,76"/>
<path class="spine" marker-end="url(#ar-s-dark)" d="M727,76 C749,76 749,68 768,68"/>
<text class="cap" x="24" y="221">Across projects, notes go only dev/main &lt;-&gt; &lt;P&gt;/main, never lane to lane.</text>
<text class="cap" x="24" y="237">Your words travel verbatim on operator-said: lines: dev main -&gt; project main -&gt; lane.</text>
</svg>
